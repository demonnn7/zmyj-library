            // ================================================================

            async function saveDescription() {
                const text = descriptionText.innerText.trim();
                description = text || '（空）';
                await saveDescriptionToDB(description);
            }

            // ================================================================
            //  17. UI 切换
            // ================================================================

            function toggleFilterPanel() {
                filterPanel.classList.toggle('open');
            }

            // ================================================================
            //  18. 初始化
            // ================================================================

            async function init() {
                await loadOptionsFromDB();
                await loadBooksFromDB();
                await loadDescriptionFromDB();

                // 恢复用户会话
                if (loadUserSession()) {
                    await loadUserReads();
                }

                // 恢复管理员会话
                const adminSession = loadAdminSession();
                if (adminSession && adminSession.admin) {
                    isAdmin = true;
                }

                renderTableHeader();
                renderFilterPanel();
                renderBooks(currentFilter);
                updateUIForUser();
                updateUIForAdmin();

                // ---------- 事件绑定 ----------
                loginBtn.addEventListener('click', () => {
                    loginModal.classList.add('active');
                    loginError.style.display = 'none';
                    loginUsername.value = '';
                    setTimeout(() => loginUsername.focus(), 100);
                });

                adminLoginBtn.addEventListener('click', function() {
                    if (isAdmin) {
                        // 如果已经是管理员，点击退出管理员
                        isAdmin = false;
                        clearAdminSession();
                        updateUIForAdmin();
                        showToast('管理员已退出', 'success');
                    } else {
                        // 打开登录模态框，让用户选择管理员登录
                        loginModal.classList.add('active');
                        loginError.style.display = 'none';
                        loginUsername.value = '';
                    }
                });

                logoutBtn.addEventListener('click', handleLogout);

                loginConfirmBtn.addEventListener('click', handleUserLogin);
                loginAdminBtn.addEventListener('click', function() {
                    loginModal.classList.remove('active');
                    handleAdminLogin();
                });

                loginCancelBtn.addEventListener('click', () => {
                    loginModal.classList.remove('active');
                    loginError.style.display = 'none';
                });
                loginModal.addEventListener('click', function(e) {
                    if (e.target === this) {
                        loginModal.classList.remove('active');
                        loginError.style.display = 'none';
                    }
                });
                loginUsername.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') handleUserLogin();
                });

                loginPassword.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') handleUserLogin();
                });

                applyBtn.addEventListener('click', applyFilterAndRender);
                resetBtn.addEventListener('click', resetFilter);
                filterToggleBtn.addEventListener('click', toggleFilterPanel);
                document.getElementById('closeFilterPanelBtn').addEventListener('click', function() {
                    filterPanel.classList.remove('open');
                });

                // ===== 登录/注册模式切换 =====
                loginTabBtn.addEventListener('click', function() {
                    isLoginMode = true;
                    loginModalTitle.textContent = '🔑 登录';
                    loginConfirmBtn.textContent = '登录';
                    loginHint.textContent = '输入用户名和密码登录';
                    loginError.style.display = 'none';
                    usernameCheckResult.style.display = 'none';
                    this.className = 'btn btn-primary';
                    this.style.cssText = 'flex:1; border-radius:30px; padding:0.3rem 0.5rem; font-size:0.8rem;';
                    registerTabBtn.className = 'btn btn-secondary';
                    registerTabBtn.style.cssText = 'flex:1; border-radius:30px; padding:0.3rem 0.5rem; font-size:0.8rem;';
                    // 重新检测用户名
                    if (loginUsername.value.trim()) {
                        loginUsername.dispatchEvent(new Event('input'));
                    }
                });

                registerTabBtn.addEventListener('click', function() {
                    isLoginMode = false;
                    loginModalTitle.textContent = '📝 注册';
                    loginConfirmBtn.textContent = '注册';
                    loginHint.textContent = '输入用户名和密码注册新账号';
                    loginError.style.display = 'none';
                    usernameCheckResult.style.display = 'none';
                    this.className = 'btn btn-primary';
                    this.style.cssText = 'flex:1; border-radius:30px; padding:0.3rem 0.5rem; font-size:0.8rem;';
                    loginTabBtn.className = 'btn btn-secondary';
                    loginTabBtn.style.cssText = 'flex:1; border-radius:30px; padding:0.3rem 0.5rem; font-size:0.8rem;';
                    // 重新检测用户名
                    if (loginUsername.value.trim()) {
                        loginUsername.dispatchEvent(new Event('input'));
                    }
                });

                
                // 选项卡切换
                tabAll.addEventListener('click', function() {
                    if (isAuthorMode) {
                        // 作者模式下，切换到全部文章（但保留作者筛选）
                        currentTab = 'all';
                        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                        this.classList.add('active');
                        currentPage = 1;
                        renderBooks(currentFilter);
                        return;
                    }
                    currentTab = 'all';
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentPage = 1;
                    renderBooks(currentFilter);
                });

                tabRead.addEventListener('click', function() {
                    if (!currentUser) {
                        showToast('请先登录查看已读文章', 'error');
                        return;
                    }
                    // 作者模式下也允许切换到已读，但保留作者筛选
                    currentTab = 'read';
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentPage = 1;
                    renderBooks(currentFilter);
                });

                tabWant.addEventListener('click', function() {
                    if (!currentUser) {
                        showToast('请先登录查看想看文章', 'error');
                        return;
                    }
                    // 作者模式下也允许切换到想看，但保留作者筛选
                    currentTab = 'want';
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentPage = 1;
                    renderBooks(currentFilter);
                });

                // ===== 只看未读开关 =====
                if (showUnreadOnly) {
                    showUnreadOnly.addEventListener('change', function() {
                        showUnreadOnlyState = this.checked;
                        currentPage = 1;
                        renderBooks(currentFilter);
                    });
                }

                toggleAddRowBtn.addEventListener('click', openAddModal);

                descriptionText.addEventListener('blur', saveDescription);
                descriptionText.addEventListener('input', function() {
                    clearTimeout(window._descSaveTimer);
                    window._descSaveTimer = setTimeout(saveDescription, 1000);
                });

                modalCancelBtn.addEventListener('click', closeEditModal);
                modalSaveBtn.addEventListener('click', saveEditModal);
                editModal.addEventListener('click', function(e) {
                    if (e.target === editModal) closeEditModal();
                });

                manageOptionsBtn.addEventListener('click', openOptionsModal);
                optionsCancelBtn.addEventListener('click', function() {
                    // 取消时恢复备份
                    if (OPTIONS_BACKUP) {
                        OPTIONS = JSON.parse(JSON.stringify(OPTIONS_BACKUP));
                        OPTIONS_BACKUP = null;
                        // 重新渲染相关界面
                        renderFilterPanel();
                        renderAddRowSelectors();
                        renderBooks(currentFilter);
                    }
                    optionsModal.classList.remove('active');
                });
                optionsSaveBtn.addEventListener('click', function() {
                    // 保存时清除备份，确认修改
                    OPTIONS_BACKUP = null;
                    saveOptionsAndClose();
                });
                optionsModal.addEventListener('click', function(e) {
                    if (e.target === optionsModal) closeOptionsModal();
                });

                addModalCancelBtn.addEventListener('click', closeAddModal);
                addModalSaveBtn.addEventListener('click', addBookFromModal);
                addModal.addEventListener('click', function(e) {
                    if (e.target === this) closeAddModal();
                });

                // 搜索框事件
                if (searchTitle) {
                    searchTitle.addEventListener('input', function() {
                        applyFilterAndRender();
                    });
                    searchTitle.addEventListener('focus', function() {
                        this.select();
                    });
                }

                if (searchAuthor) {
                    searchAuthor.addEventListener('input', function() {
                        applyFilterAndRender();
                    });
                    searchAuthor.addEventListener('focus', function() {
                        this.select();
                    });
                }

                if (clearSearchBtn) {
                    clearSearchBtn.addEventListener('click', function() {
                        if (searchTitle) searchTitle.value = '';
                        if (searchAuthor) searchAuthor.value = '';
                        applyFilterAndRender();
                    });
                }

                filterPanel.classList.remove('open');
                filterToggleBtn.innerHTML = '<span>⚙️</span> 筛选 <span id="filterIndicator">(' + BOOKS.length +
                    ')</span>';
                const ind = document.getElementById('filterIndicator');
                if (ind) ind.textContent = `(${BOOKS.length})`;

                descriptionText.addEventListener('input', function() {
                    clearTimeout(window._descSaveTimer);
                    window._descSaveTimer = setTimeout(saveDescription, 1000);
                });

                // ===== 描述区展开/收起 =====
                if (descToggleBtn && descText) {
                    descToggleBtn.addEventListener('click', function() {
                        isDescExpanded = !isDescExpanded;
                        descText.classList.toggle('expanded', isDescExpanded);
                        this.textContent = isDescExpanded ? '📖 收起' : '📖 展开';
                    });
                }

                renderFilterPanel();
                // ===== 初始化作者筛选 =====
                updateAuthorFilterUI();
                updateTabBarVisibility();

                console.log('✅ 图书馆管理系统初始化完成');
                console.log(`📚 共加载 ${BOOKS.length} 篇文章`);
                console.log('🔑 管理员密码: zmyj210602');
                if (currentUser) {
                    console.log(`👤 当前用户: ${currentUser.username}`);
                    console.log(`📖 已读: ${userReads.length} 篇`);
                }
            }

            if (document.readyState === 'complete' || document.readyState === 'interactive') {
                init();
            } else {
                document.addEventListener('DOMContentLoaded', init);
            }

        })();

        
    </script>

</body>
</html>
