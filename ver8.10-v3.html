                        } else if (col.key === 'tags') {
                            const tags = Array.isArray(value) ? value : [value];
                            value = tags.filter(t => t).map(t => {
                                const { hue, sat, lig } = getTagColor(t);
                                const color = `hsl(${hue}, ${sat}%, ${lig}%)`;
                                const textColor = lig > 60 ? '#1e293b' : '#ffffff';
                                return `<span class="tag-badge" style="background:${color}; color:${textColor};">${t}</span>`;
                            }).join(' ');
                        } else if (col.key === 'status') {
                            let cls = 'status-completed';
                            if (value === '连载中' || value === '未完结') cls = 'status-serializing';
                            else if (value === '断更') cls = 'status-hiatus';
                            value = `<span class="status-badge ${cls}">${value || '-'}</span>`;
                        } else if (col.key === 'link') {
                            if (Array.isArray(value) && value.length > 0) {
                                const validLinks = value.filter(l => l && l.url && l.url !== '#');
                                if (validLinks.length > 0) {
                                    const isSingleLegacyLink = validLinks.length === 1 && validLinks[0].platform === '链接';
                                    if (isSingleLegacyLink) {
                                        const url = validLinks[0].url;
                                        value = `<a href="${url}" class="link-icon" target="_blank" style="border-bottom:1px dotted #94a3b8; font-size:0.8rem; display:inline-flex; align-items:center; gap:0.1rem; text-decoration:none; color:#1f4b6e;">
                                            <span style="font-size:0.9rem;">🔗</span>链接
                                        </a>`;
                                    } else {
                                        const linksHtml = validLinks.map(l => {
                                            return `<span class="tag-badge" style="background:#eef2f6; padding:0.1rem 0.5rem; display:inline-flex; align-items:center; gap:0.2rem; margin:0.1rem 0.1rem;">
                                                <span style="font-weight:600; color:#1f4b6e; font-size:0.7rem;">${l.platform}:</span>
                                                <a href="${l.url}" class="link-icon" target="_blank" style="border-bottom:1px dotted #94a3b8; font-size:0.7rem;">链接</a>
                                            </span>`;
                                        }).join(' ');
                                        value = linksHtml;
                                    }
                                } else {
                                    value = '-';
                                }
                            } else {
                                value = '-';
                            }
                        } else if (col.key === 'chapters') {
                            value = `<span style="font-weight:500;">${value || '-'}</span>`;
                        } else if (col.key === 'car') {
                            value = `<span style="font-size:1.2rem;">${value || '-'}</span>`;
                        } else if (col.key === 'platform') {
                            const platforms = Array.isArray(value) ? value : [value];
                            value = platforms.filter(p => p).map(p => 
                                `<span class="tag-badge">${p}</span>`
                            ).join(' ');
                        } else if (col.key === 'author') {
                            const authorNames = (value || '').split('/').map(a => a.trim()).filter(a => a);
                            if (authorNames.length > 0) {
                                const authorLinks = authorNames.map(name => {
                                    return `<span class="author-link" data-author="${name}" style="cursor:pointer; color:#1f4b6e; text-decoration:underline; text-underline-offset:2px; text-decoration-style:dotted; transition:color 0.2s; margin:0 0.05rem;" onmouseover="this.style.color='#143049'" onmouseout="this.style.color='#1f4b6e'">${name}</span>`;
                                }).join(' / ');
                                value = authorLinks;
                            } else {
                                value = '-';
                            }
                        } else {
                            value = value ?? '-';
                        }
                        bodyHtml +=
                            `<td style="width:${col.width}; min-width:${col.width}; max-width:${col.width}; word-break:break-word; box-sizing:border-box;">${value}</td>`;
                    });

                    bodyHtml += '</tr>';
                });
                tableBody.innerHTML = bodyHtml;

                renderPagination(totalCount, totalPages, currentPage);

                // ===== 作者名点击筛选 =====
                document.querySelectorAll('#tableBody .author-link').forEach(el => {
                    el.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const authorName = this.dataset.author;
                        if (authorName) {
                            setAuthorFilter(authorName);
                        }
                    });
                });

                updateTabCounts();

                // ===== 已读和想看按钮事件 =====
                if (currentUser) {
                    document.querySelectorAll('#tableBody .read-toggle').forEach(btn => {
                        btn.addEventListener('click', function() {
                            const id = parseInt(this.dataset.id);
                            toggleRead(id);
                        });
                    });
                    document.querySelectorAll('#tableBody .want-toggle').forEach(btn => {
                        btn.addEventListener('click', function() {
                            const id = parseInt(this.dataset.id);
                            toggleWant(id);
                        });
                    });
                }

                // ===== 编辑和删除按钮事件 =====
                if (isAdmin) {
                    document.querySelectorAll('#tableBody .btn-sm.edit').forEach(btn => {
                        btn.addEventListener('click', () => {
                            const id = parseInt(btn.dataset.id);
                            openEditModal(id);
                        });
                    });
                    document.querySelectorAll('#tableBody .btn-sm.danger').forEach(btn => {
                        btn.addEventListener('click', () => {
                            const id = parseInt(btn.dataset.id);
                            if (confirm('确定删除这篇文章吗？')) {
                                deleteBook(id);
                            }
                        });
                    });
                }

                // ===== 拖拽排序（仅管理员） =====
                if (isAdmin) {
                    setupDragAndDrop();
                }

                // ===== 双击序号原地修改 =====
                if (isAdmin) {
                    const indexCells = tableBody.querySelectorAll('.index-cell');
                    indexCells.forEach(cell => {
                        cell.addEventListener('dblclick', function(e) {
                            e.stopPropagation();
                            if (this.querySelector('input')) return;
                            const currentGlobalIndex = parseInt(this.dataset.index);
                            const bookId = parseInt(this.dataset.bookid);
                            const total = BOOKS.length;
                            const currentValue = currentGlobalIndex + 1;
                            const originalText = this.textContent;
                            const input = document.createElement('input');
                            input.type = 'number';
                            input.min = 1;
                            input.max = total;
                            input.value = currentValue;
                            input.className = 'index-input';
                            input.style.width = '40px';
                            input.style.padding = '0.1rem 0.2rem';
                            input.style.border = '2px solid #1f4b6e';
                            input.style.borderRadius = '6px';
                            input.style.fontSize = '0.85rem';
                            input.style.fontWeight = '600';
                            input.style.textAlign = 'center';
                            input.style.background = 'white';
                            input.style.color = '#1e293b';
                            input.style.outline = 'none';
                            input.style.boxShadow = '0 0 0 3px rgba(31, 75, 110, 0.15)';
                            this.textContent = '';
                            this.appendChild(input);
                            input.focus();
                            input.select();
                            const cellRef = this;
                            function finishEdit(save = true) {
                                if (!save) {
                                    cellRef.textContent = originalText;
                                    return;
                                }
                                const newValue = parseInt(input.value);
                                if (isNaN(newValue) || newValue < 1 || newValue > total) {
                                    showToast('❌ 请输入有效序号（1-' + total + '）', 'error');
                                    cellRef.textContent = originalText;
                                    return;
                                }
                                const targetIndex = newValue - 1;
                                const currentBookIndex = BOOKS.findIndex(b => b.id === bookId);
                                if (currentBookIndex === -1) {
                                    cellRef.textContent = originalText;
                                    return;
                                }
                                if (currentBookIndex === targetIndex) {
                                    cellRef.textContent = originalText;
                                    return;
                                }
                                const [movedBook] = BOOKS.splice(currentBookIndex, 1);
                                BOOKS.splice(targetIndex, 0, movedBook);
                                BOOKS.forEach((book, idx) => {
                                    book.sort_order = idx + 1;
                                });
                                currentPage = 1;
                                renderBooks(currentFilter);
                                showToast('✅ 序号已更新', 'success');
                                saveBooksToDB();
                            }
                            input.addEventListener('keydown', function(e) {
                                if (e.key === 'Enter') {
                                    e.preventDefault();
                                    finishEdit(true);
                                } else if (e.key === 'Escape') {
                                    e.preventDefault();
                                    finishEdit(false);
                                }
                            });
                            input.addEventListener('blur', function() {
                                setTimeout(() => {
                                    if (cellRef.querySelector('input')) {
                                        finishEdit(true);
                                    }
                                }, 150);
                            });
                            input.addEventListener('click', function(e) {
                                e.stopPropagation();
                            });
                        });
                    });
                }
            }

            // ===== 作者筛选控制 =====
            function setAuthorFilter(authorName) {
                // 如果点击的是同一个作者，取消筛选
                if (currentAuthorFilter === authorName && isAuthorMode) {
                    clearAuthorFilter();
                    return;
                }
                
                // 保存当前状态（用于返回）- 深拷贝 currentFilter
                previousTabBeforeAuthor = currentTab;
                // 深拷贝 Set 对象
                const savedFilter = {};
                FILTER_FIELDS.forEach(field => {
                    savedFilter[field] = new Set(currentFilter[field] || []);
                });
                previousFilterBeforeAuthor = savedFilter;
                previousShowUnreadOnly = showUnreadOnlyState;
                
                isAuthorMode = true;
                
                // 重置筛选条件
                FILTER_FIELDS.forEach(field => { currentFilter[field] = new Set(); });
                document.querySelectorAll('#filterGrid input[type="checkbox"]').forEach(cb => { cb.checked = false; });
                
                // 关闭"只看未读"
                showUnreadOnlyState = false;
                if (showUnreadOnly) {
                    showUnreadOnly.checked = false;
                }
                
                // 切换到全部文章
                currentTab = 'all';
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                tabAll.classList.add('active');
                
                // 设置作者筛选
                currentAuthorFilter = authorName;
                currentPage = 1;
                
                // 更新 UI
                updateTabBarVisibility();
                renderBooks(currentFilter);
                updateAuthorFilterUI();
            }

            function clearAuthorFilter() {
                // ===== 第一步：清除作者筛选状态 =====
                currentAuthorFilter = null;
                isAuthorMode = false;
                
                // ===== 第二步：移除作者筛选的 badge =====
                const existingBadge = document.getElementById('authorFilterBadge');
                if (existingBadge) {
                    existingBadge.remove();
                }
                
                // ===== 第三步：恢复之前的栏目 =====
                if (previousTabBeforeAuthor) {
                    currentTab = previousTabBeforeAuthor;
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    if (currentTab === 'all') {
                        tabAll.classList.add('active');
                    } else if (currentTab === 'read') {
                        tabRead.classList.add('active');
                    } else if (currentTab === 'want') {
                        tabWant.classList.add('active');
                    }
                }
                
                // ===== 第四步：恢复选项卡可见性 =====
                const tabBar = document.getElementById('tabBar');
                if (currentUser) {
                    tabBar.style.display = 'flex';
                } else {
                    tabBar.style.display = 'none';
                }
                tabAll.style.display = 'inline-block';
                tabRead.style.display = 'inline-block';
                tabWant.style.display = 'inline-block';
                
                // ===== 第五步：恢复筛选条件 =====
                // 先重置所有筛选
                FILTER_FIELDS.forEach(field => { currentFilter[field] = new Set(); });
                
                // 如果有保存的筛选条件，恢复它们
                if (previousFilterBeforeAuthor) {
                    // 恢复 currentFilter
                    FILTER_FIELDS.forEach(field => {
                        if (previousFilterBeforeAuthor[field] && previousFilterBeforeAuthor[field].size > 0) {
                            previousFilterBeforeAuthor[field].forEach(value => {
                                currentFilter[field].add(value);
                            });
                        }
                    });
                    
                    // 恢复筛选面板的复选框状态
                    document.querySelectorAll('#filterGrid input[type="checkbox"]').forEach(cb => {
                        const field = cb.dataset.field;
                        if (currentFilter[field] && currentFilter[field].has(cb.value)) {
                            cb.checked = true;
                        } else {
                            cb.checked = false;
                        }
                    });
                }
                
                // ===== 第六步：恢复"只看未读"状态 =====
                showUnreadOnlyState = previousShowUnreadOnly;
                if (showUnreadOnly) {
                    showUnreadOnly.checked = previousShowUnreadOnly;
                }
                
                // ===== 第七步：重置临时变量 =====
                previousTabBeforeAuthor = 'all';
                previousFilterBeforeAuthor = null;
                previousShowUnreadOnly = false;
                currentPage = 1;
                
                // ===== 第八步：强制刷新数据 =====
                renderBooks(currentFilter);
                updateFilterIndicator();
            }


            function updateTabBarVisibility() {
                const tabBar = document.getElementById('tabBar');
                if (isAuthorMode) {
                    // 作者模式下，全部显示但切换逻辑由点击事件控制
                    tabAll.style.display = 'inline-block';
                    tabRead.style.display = 'inline-block';
                    tabWant.style.display = 'inline-block';
                    if (currentUser) {
                        tabBar.style.display = 'flex';
                    }
                } else {
                    tabAll.style.display = 'inline-block';
                    tabRead.style.display = 'inline-block';
                    tabWant.style.display = 'inline-block';
                    if (currentUser) {
                        tabBar.style.display = 'flex';
                    } else {
                        tabBar.style.display = 'none';
                    }
                }
            }

            function updateFilterIndicator() {
                const searchTitle = document.getElementById('searchTitle');
                const searchAuthor = document.getElementById('searchAuthor');
                const titleKeyword = searchTitle ? searchTitle.value.trim().toLowerCase() : '';
                const authorKeyword = searchAuthor ? searchAuthor.value.trim().toLowerCase() : '';
                
                // 先应用作者筛选
                let workingBooks = BOOKS;
                if (currentAuthorFilter) {
                    workingBooks = BOOKS.filter(book => {
                        const authors = (book.author || '').split('/').map(a => a.trim()).filter(a => a);
                        return authors.some(a => a === currentAuthorFilter);
                    });
                }
                
                let count = 0;
                workingBooks.forEach(book => {
                    // 应用平台筛选
                    if (currentFilter.platform.size > 0) {
                        const bookPlatforms = Array.isArray(book.platform) ? book.platform : [book.platform];
                        if (!bookPlatforms.some(p => currentFilter.platform.has(p))) return;
                    }
                    // 应用 tag 筛选
                    if (currentFilter.tags.size > 0) {
                        const bookTags = book.tags || [];
                        if (!bookTags.some(t => currentFilter.tags.has(t))) return;
                    }
                    if (currentFilter.status.size > 0 && !currentFilter.status.has(book.status)) return;
                    if (currentFilter.ending.size > 0 && !currentFilter.ending.has(book.ending)) return;
                    if (currentFilter.attributes.size > 0 && !currentFilter.attributes.has(book.attributes)) return;
                    if (currentFilter.car.size > 0 && !currentFilter.car.has(book.car)) return;
                    if (currentFilter.chapters.size > 0) {
                        const wantsMultiChapter = currentFilter.chapters.has('多篇章');
                        const wantsOneShot = currentFilter.chapters.has('一发完');
                        if (wantsMultiChapter && !wantsOneShot) {
                            const isMultiChapter = /^\d+章$/.test(book.chapters) || book.chapters === '多篇章';
                            if (!isMultiChapter) return;
                        } else if (wantsOneShot && !wantsMultiChapter) {
                            if (book.chapters !== '一发完') return;
                        } else if (wantsOneShot && wantsMultiChapter) {
                            const isMatch = book.chapters === '一发完' || /^\d+章$/.test(book.chapters) || book.chapters === '多篇章';
                            if (!isMatch) return;
                        } else {
                            if (!currentFilter.chapters.has(book.chapters)) return;
                        }
                    }
                    if (titleKeyword && !(book.title || '').toLowerCase().includes(titleKeyword)) return;
                    if (authorKeyword && !(book.author || '').toLowerCase().includes(authorKeyword)) return;
                    count++;
                });
                
                const filterIndicator = document.getElementById('filterIndicator');
                if (filterIndicator) {
                    if (currentAuthorFilter) {
                        filterIndicator.textContent = `(✍️ ${currentAuthorFilter} · ${count}/${workingBooks.length})`;
                    } else {
                        filterIndicator.textContent = `(${BOOKS.length})`;
                    }
                }
            }

            function updateAuthorFilterUI() {
                const filterBar = document.querySelector('.filter-bar');
                let existingBadge = document.getElementById('authorFilterBadge');
                
                if (existingBadge) {
                    existingBadge.remove();
                }
                
                if (currentAuthorFilter) {
                    const badge = document.createElement('div');
                    badge.id = 'authorFilterBadge';
                    badge.style.cssText = 'display:flex; align-items:center; gap:0.5rem; padding:0.2rem 0.8rem; background:#eef2ff; border-radius:30px; border:1px solid #93c5fd; font-size:0.85rem; color:#1f4b6e;';
                    badge.innerHTML = `
                        <span>✍️ 作者：<strong>${currentAuthorFilter}</strong></span>
                        <button class="btn btn-sm" id="clearAuthorFilterBtn" style="padding:0.05rem 0.5rem; font-size:0.65rem; border:1px solid #93c5fd; background:transparent; border-radius:30px; cursor:pointer; color:#1f4b6e;">✕ 返回</button>
                    `;
                    
                    const leftContainer = filterBar.querySelector('div:first-child');
                    if (leftContainer) {
                        leftContainer.insertBefore(badge, leftContainer.firstChild);
                    }
                    
                    const clearBtn = document.getElementById('clearAuthorFilterBtn');
                    if (clearBtn) {
                        clearBtn.addEventListener('click', function(e) {
                            e.stopPropagation();
                            clearAuthorFilter();
                        });
                    }
                } else {
                    updateTabBarVisibility();
                }
            }

            // ================================================================
            //  9. 拖拽排序
            // ================================================================

            function setupDragAndDrop() {
                const rows = tableBody.querySelectorAll('tr');
                let dragIndex = null;
                let isDragging = false;
                let dragStartY = 0;
                let rowHeight = 0;
                let targetRowIndex = null;
                let dragRow = null;
                let container = document.querySelector('.table-container');
                let scrollFrame = null;
                let dragRowInitialRect = null;
                let initialPageScrollY = 0;
                let dragStartMouseY = 0;
                let lastMouseY = 0;

                // ---------- 触摸拖拽相关变量 ----------
                let touchDragClone = null;
                let touchOffsetY = 0;
                let touchStartRowTop = 0;

                // 停止自动滚动
                function stopAutoScroll() {
                    if (scrollFrame) {
                        cancelAnimationFrame(scrollFrame);
                        scrollFrame = null;
                    }
                }

                // 开始自动滚动 - 滚动整个页面
                function startAutoScroll(direction) {
                    stopAutoScroll();
                    const speed = 6;

                    function scrollStep() {
                        if (!isDragging || !dragRow) {
                            stopAutoScroll();
                            return;
                        }
                        window.scrollBy(0, speed * direction);
                        updateDragRowPosition();
                        scrollFrame = requestAnimationFrame(scrollStep);
                    }
                    scrollFrame = requestAnimationFrame(scrollStep);
                }

                // 更新被拖拽行位置
                function updateDragRowPosition() {
                    if (!dragRow || !isDragging) return;

                    const containerRect = container.getBoundingClientRect();
                    const mouseY = window._dragMouseY || (containerRect.top + containerRect.height / 2);

                    const pageScrollDelta = window.scrollY - initialPageScrollY;
                    const mouseRelativeToContainer = mouseY - containerRect.top + container.scrollTop + pageScrollDelta;

                    let targetTop = mouseRelativeToContainer - dragStartY;

                    if (targetTop < 0) {
                        targetTop = 0;
                    }
                    if (targetTop + rowHeight > container.scrollHeight) {
                        targetTop = container.scrollHeight - rowHeight;
                    }

                    const deltaY = targetTop - dragRowInitialRect.top;
                    dragRow.style.transform = `translateY(${deltaY}px)`;
                }

                // 清除所有行的拖拽状态
                function clearAllDragStates() {
                    rows.forEach(r => {
                        r.classList.remove('drag-over');
                        r.classList.remove('dragging');
                        r.style.transform = '';
                        r.style.opacity = '';
                        r.style.zIndex = '';
                        r.style.boxShadow = '';
                        r.style.position = '';
                        r.style.transition = '';
                        r.style.background = '';
                    });
                    const indicators = document.querySelectorAll('.drag-indicator-line');
                    indicators.forEach(el => el.remove());
                    dragRow = null;
                    dragRowInitialRect = null;
                    if (touchDragClone && touchDragClone.parentNode) {
                        touchDragClone.parentNode.removeChild(touchDragClone);
                        touchDragClone = null;
                    }
                }

                // 在目标行上方插入深色指示线
                function showDragIndicator(row) {
                    const indicators = document.querySelectorAll('.drag-indicator-line');
                    indicators.forEach(el => el.remove());

                    if (!row) return;

                    const indicator = document.createElement('div');
                    indicator.className = 'drag-indicator-line';
                    indicator.style.cssText = `
                        height: 3px;
                        background: #1f4b6e;
                        position: absolute;
                        left: 0;
                        right: 0;
                        top: -2px;
                        z-index: 50;
                        border-radius: 2px;
                        box-shadow: 0 0 8px rgba(31, 75, 110, 0.3);
                        pointer-events: none;
                    `;
                    row.style.position = 'relative';
                    row.appendChild(indicator);
                }

                // 查找目标行
                function findTargetRow(mouseY) {
                    const allRows = Array.from(rows);
                    let targetRow = null;

                    const containerRect = container.getBoundingClientRect();
                    const pageScrollDelta = window.scrollY - initialPageScrollY;
                    const mouseRelativeToContainer = mouseY - containerRect.top + container.scrollTop + pageScrollDelta;

                    const rowPositions = allRows.map((r) => {
                        const rRect = r.getBoundingClientRect();
                        const rowTop = rRect.top - containerRect.top + container.scrollTop + pageScrollDelta;
                        const rowBottom = rRect.bottom - containerRect.top + container.scrollTop + pageScrollDelta;
                        return { row: r, top: rowTop, bottom: rowBottom, mid: (rowTop + rowBottom) / 2 };
                    });

                    const filteredPositions = rowPositions.filter(p => p.row !== dragRow);

                    for (let i = 0; i < filteredPositions.length; i++) {
                        const pos = filteredPositions[i];
                        if (mouseRelativeToContainer > pos.top && mouseRelativeToContainer < pos.mid) {
                            targetRow = pos.row;
                            break;
                        }
                        if (mouseRelativeToContainer > pos.mid && mouseRelativeToContainer < pos.bottom) {
                            if (i + 1 < filteredPositions.length) {
                                targetRow = filteredPositions[i + 1].row;
                            } else {
                                targetRow = pos.row;
                            }
                            break;
                        }
                    }

                    if (!targetRow) {
                        for (let i = 0; i < filteredPositions.length - 1; i++) {
                            const pos1 = filteredPositions[i];
                            const pos2 = filteredPositions[i + 1];
                            if (mouseRelativeToContainer > pos1.bottom && mouseRelativeToContainer < pos2.top) {
                                targetRow = pos2.row;
                                break;
                            }
                        }
                    }

                    if (!targetRow && filteredPositions.length > 0) {
                        const firstPos = filteredPositions[0];
                        if (mouseRelativeToContainer < firstPos.top) {
                            targetRow = firstPos.row;
                        }
                    }

                    if (!targetRow && filteredPositions.length > 0) {
                        const lastPos = filteredPositions[filteredPositions.length - 1];
                        if (mouseRelativeToContainer > lastPos.bottom) {
                            targetRow = lastPos.row;
                        }
                    }

                    return targetRow;
                }

                // ---------- 鼠标拖拽事件 ----------
                function onDocumentDragOver(e) {
                    if (!isDragging || !dragRow) return;
                    e.preventDefault();

                    window._dragMouseY = e.clientY;
                    lastMouseY = e.clientY;

                    updateDragRowPosition();

                    const mouseY = e.clientY;
                    const targetRow = findTargetRow(mouseY);

                    rows.forEach(r => r.classList.remove('drag-over'));
                    const indicators = document.querySelectorAll('.drag-indicator-line');
                    indicators.forEach(el => el.remove());

                    if (targetRow && targetRow !== dragRow) {
                        const targetBookId = parseInt(targetRow.querySelector('.edit')?.dataset.id);
                        const targetIndex = BOOKS.findIndex(b => b.id === targetBookId);
                        if (targetIndex !== -1 && targetIndex !== dragIndex) {
                            targetRow.classList.add('drag-over');
                            showDragIndicator(targetRow);
                            targetRowIndex = targetIndex;
                        }
                    } else {
                        targetRowIndex = null;
                    }

                    const viewportHeight = window.innerHeight;
                    const mouseYInViewport = e.clientY;
                    const scrollThreshold = 80;

                    const distanceToPageTop = mouseYInViewport;
                    const distanceToPageBottom = viewportHeight - mouseYInViewport;

                    const maxScrollY = document.documentElement.scrollHeight - viewportHeight;
                    const canScrollUp = window.scrollY > 0;
                    const canScrollDown = window.scrollY < maxScrollY;

                    if (distanceToPageTop < scrollThreshold && canScrollUp) {
                        if (!scrollFrame) {
                            startAutoScroll(-1);
                        }
                    } else if (distanceToPageBottom < scrollThreshold && canScrollDown) {
                        if (!scrollFrame) {
                            startAutoScroll(1);
                        }
                    } else {
                        stopAutoScroll();
                    }
                }

                // ---------- 触摸拖拽事件 ----------
                function onTouchStart(e) {
                    // ===== 关键：阻止默认行为，防止页面滚动 =====
                    e.preventDefault();

                    const touch = e.touches[0];
                    const handle = e.currentTarget;
                    const row = handle.closest('tr');
                    
                    // 检查是否点击的是拖拽手柄
                    if (!row) return;
                    
                    const bookId = parseInt(row.querySelector('.edit')?.dataset.id);
                    const idx = BOOKS.findIndex(b => b.id === bookId);
                    if (idx === -1) return;

                    // 阻止页面滚动
                    e.preventDefault();

                    dragIndex = idx;
                    dragRow = row;
                    isDragging = true;
                    container = document.querySelector('.table-container');

                    const rect = row.getBoundingClientRect();
                    const containerRect = container.getBoundingClientRect();
                    rowHeight = rect.height;

                    touchOffsetY = touch.clientY - rect.top;
                    touchStartRowTop = rect.top;
                    dragStartY = touch.clientY - rect.top;
                    initialPageScrollY = window.scrollY;
                    dragStartMouseY = touch.clientY;
                    lastMouseY = touch.clientY;

                    dragRowInitialRect = {
                        top: rect.top - containerRect.top + container.scrollTop,
                        left: rect.left - containerRect.left
                    };

                    window._dragMouseY = touch.clientY;

                    // 创建触摸拖拽克隆（用于视觉反馈）
                    touchDragClone = row.cloneNode(true);
                    touchDragClone.style.position = 'fixed';
                    touchDragClone.style.zIndex = '9999';
                    touchDragClone.style.pointerEvents = 'none';
                    touchDragClone.style.width = row.offsetWidth + 'px';
                    touchDragClone.style.background = '#ffffff';
                    touchDragClone.style.boxShadow = '0 8px 30px rgba(0,0,0,0.25)';
                    touchDragClone.style.borderRadius = '8px';
                    touchDragClone.style.border = '2px solid #1f4b6e';
                    touchDragClone.style.opacity = '0.92';
                    touchDragClone.style.display = 'table';
                    touchDragClone.style.tableLayout = 'fixed';
                    touchDragClone.style.transform = 'scale(1.02)';
                    
                    // 复制列宽
                    const cells = row.querySelectorAll('td');
                    const cloneCells = touchDragClone.querySelectorAll('td');
                    cells.forEach((td, idx2) => {
                        if (cloneCells[idx2]) {
                            cloneCells[idx2].style.width = td.offsetWidth + 'px';
                            cloneCells[idx2].style.minWidth = td.offsetWidth + 'px';
                            cloneCells[idx2].style.maxWidth = td.offsetWidth + 'px';
                            cloneCells[idx2].style.boxSizing = 'border-box';
                        }
                    });
                    
                    touchDragClone.querySelectorAll('.edit, .danger, .drag-handle').forEach(el => {
                        el.style.pointerEvents = 'none';
                    });
                    
                    document.body.appendChild(touchDragClone);
                    touchDragClone.style.left = (touch.clientX - 10) + 'px';
                    touchDragClone.style.top = (touch.clientY - touchOffsetY) + 'px';

                    row.classList.add('dragging');
                    row.style.opacity = '0.4';
                    row.style.zIndex = '10';
                    row.style.position = 'relative';
                    row.style.transition = 'none';
                    row.style.boxShadow = '0 2px 12px rgba(0,0,0,0.1)';
                    row.style.background = '#ffffff';

                    // 绑定触摸移动和结束事件
                    document.addEventListener('touchmove', onTouchMove, { passive: false });
                    document.addEventListener('touchend', onTouchEnd, { passive: false });
                    document.addEventListener('touchcancel', onTouchEnd, { passive: false });
                }

                function onTouchMove(e) {
                    e.preventDefault();
                    if (!isDragging || !dragRow) return;

                    const touch = e.touches[0];
                    const clientY = touch.clientY;

                    window._dragMouseY = clientY;
                    lastMouseY = clientY;

                    // 更新克隆位置
                    if (touchDragClone) {
                        touchDragClone.style.left = (touch.clientX - 10) + 'px';
                        touchDragClone.style.top = (touch.clientY - touchOffsetY) + 'px';
                    }

                    // 更新行位置
                    updateDragRowPosition();

                    // 查找目标行
                    const targetRow = findTargetRow(clientY);

                    rows.forEach(r => r.classList.remove('drag-over'));
                    const indicators = document.querySelectorAll('.drag-indicator-line');
                    indicators.forEach(el => el.remove());

                    if (targetRow && targetRow !== dragRow) {
                        const targetBookId = parseInt(targetRow.querySelector('.edit')?.dataset.id);
                        const targetIndex = BOOKS.findIndex(b => b.id === targetBookId);
                        if (targetIndex !== -1 && targetIndex !== dragIndex) {
                            targetRow.classList.add('drag-over');
                            showDragIndicator(targetRow);
                            targetRowIndex = targetIndex;
                        }
                    } else {
                        targetRowIndex = null;
                    }

                    // 页面滚动检测
                    const viewportHeight = window.innerHeight;
                    const mouseYInViewport = clientY;
                    const scrollThreshold = 80;

                    const distanceToPageTop = mouseYInViewport;
                    const distanceToPageBottom = viewportHeight - mouseYInViewport;

                    const maxScrollY = document.documentElement.scrollHeight - viewportHeight;
                    const canScrollUp = window.scrollY > 0;
                    const canScrollDown = window.scrollY < maxScrollY;

                    if (distanceToPageTop < scrollThreshold && canScrollUp) {
                        if (!scrollFrame) {
                            startAutoScroll(-1);
                        }
                    } else if (distanceToPageBottom < scrollThreshold && canScrollDown) {
                        if (!scrollFrame) {
                            startAutoScroll(1);
                        }
                    } else {
                        stopAutoScroll();
                    }
                }

                function onTouchEnd(e) {
                    if (!isDragging) {
                        return;
                    }

                    document.removeEventListener('touchmove', onTouchMove);
                    document.removeEventListener('touchend', onTouchEnd);
                    document.removeEventListener('touchcancel', onTouchEnd);

                    // 清理克隆
                    if (touchDragClone && touchDragClone.parentNode) {
                        touchDragClone.parentNode.removeChild(touchDragClone);
                        touchDragClone = null;
                    }

                    // 清除高亮
                    rows.forEach(r => r.classList.remove('drag-over'));
                    const indicators = document.querySelectorAll('.drag-indicator-line');
                    indicators.forEach(el => el.remove());

                    if (dragIndex === null || !isDragging) {
                        clearAllDragStates();
                        return;
                    }

                    let targetIdx = targetRowIndex;
                    if (targetIdx === null) {
                        const targetBookId = dragRow?.querySelector('.edit')?.dataset.id;
                        if (targetBookId) {
                            targetIdx = BOOKS.findIndex(b => b.id === parseInt(targetBookId));
                        }
                    }

                    // 清理拖拽状态
                    const tempDragRow = dragRow;
                    const tempDragIndex = dragIndex;
                    const tempTargetIdx = targetIdx;

                    clearAllDragStates();
                    stopAutoScroll();
                    window._dragMouseY = null;
                    dragRowInitialRect = null;

                    if (tempTargetIdx === -1 || tempDragIndex === tempTargetIdx || tempTargetIdx === null) {
                        isDragging = false;
                        return;
                    }

                    const [movedBook] = BOOKS.splice(tempDragIndex, 1);
                    if (tempTargetIdx > tempDragIndex) {
                        BOOKS.splice(tempTargetIdx - 1, 0, movedBook);
                    } else {
                        BOOKS.splice(tempTargetIdx, 0, movedBook);
                    }

                    BOOKS.forEach((book, idx) => {
                        book.sort_order = idx + 1;
                    });

                    isDragging = false;
                    targetRowIndex = null;
                    window._dragMouseY = null;
                    dragRowInitialRect = null;


                    renderBooks(currentFilter);
                    showToast('顺序已调整', 'success');
                    saveBooksToDB();
                }

                // ---------- 绑定事件到每个行 ----------
                rows.forEach(row => {
                    const handle = row.querySelector('.drag-handle');
                    if (!handle) return;

                    // 鼠标拖拽事件（桌面端）
                    handle.addEventListener('dragstart', function(e) {
                        const bookId = parseInt(row.querySelector('.edit')?.dataset.id);
                        dragIndex = BOOKS.findIndex(b => b.id === bookId);
                        if (dragIndex === -1) return;

                        isDragging = true;
                        dragRow = row;
                        container = document.querySelector('.table-container');

                        const rect = row.getBoundingClientRect();
                        const containerRect = container.getBoundingClientRect();
                        rowHeight = rect.height;

                        dragStartY = e.clientY - rect.top;
                        initialPageScrollY = window.scrollY;
                        dragStartMouseY = e.clientY;
                        lastMouseY = e.clientY;

                        dragRowInitialRect = {
                            top: rect.top - containerRect.top + container.scrollTop,
                            left: rect.left - containerRect.left
                        };

                        window._dragMouseY = e.clientY;

                        e.dataTransfer.effectAllowed = 'move';
                        e.dataTransfer.setData('text/plain', dragIndex);
                        const blankImg = new Image();
                        blankImg.src = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
                        e.dataTransfer.setDragImage(blankImg, 0, 0);

                        row.classList.add('dragging');
                        row.style.opacity = '0.85';
                        row.style.zIndex = '10';
                        row.style.position = 'relative';
                        row.style.transition = 'none';
                        row.style.boxShadow = '0 2px 12px rgba(0,0,0,0.1)';
                        row.style.background = '#ffffff';

                        document.addEventListener('dragover', onDocumentDragOver);
                    });

                    handle.addEventListener('dragend', function(e) {
                        isDragging = false;
                        document.removeEventListener('dragover', onDocumentDragOver);
                        clearAllDragStates();
                        stopAutoScroll();
                        window._dragMouseY = null;
                        dragRowInitialRect = null;
                    });

                    row.addEventListener('dragover', function(e) {
                        e.preventDefault();
                        e.dataTransfer.dropEffect = 'move';
                    });

                    row.addEventListener('drop', function(e) {
                        e.preventDefault();
                        document.removeEventListener('dragover', onDocumentDragOver);
                        clearAllDragStates();
                        stopAutoScroll();

                        if (dragIndex === null || !isDragging) {
                            isDragging = false;
                            return;
                        }

                        let targetIdx = targetRowIndex;
                        if (targetIdx === null) {
                            const targetBookId = parseInt(this.querySelector('.edit')?.dataset.id);
                            targetIdx = BOOKS.findIndex(b => b.id === targetBookId);
                        }

                        if (targetIdx === -1 || dragIndex === targetIdx) {
                            isDragging = false;
                            return;
                        }

                        const [movedBook] = BOOKS.splice(dragIndex, 1);
                        if (targetIdx > dragIndex) {
                            BOOKS.splice(targetIdx - 1, 0, movedBook);
                        } else {
                            BOOKS.splice(targetIdx, 0, movedBook);
                        }
                        
                        BOOKS.forEach((book, idx) => {
                            book.sort_order = idx + 1;
                        });

                        isDragging = false;
                        targetRowIndex = null;
                        window._dragMouseY = null;
                        dragRowInitialRect = null;

                        renderBooks(currentFilter);
                        showToast('顺序已调整', 'success');
                        saveBooksToDB();
                    });

                    // ========== 触摸拖拽事件（手机端） ==========
                    // 防止触摸时触发页面滚动
                    handle.addEventListener('touchstart', function(e) {
                        // 不在这里处理，由 onTouchStart 处理
                    }, { passive: true });

                    // 使用独立的触摸事件处理
                    handle.addEventListener('touchstart', onTouchStart, { passive: false });
                });
            }

            function renderPagination(total, totalPages, current) {
                removePagination();

                if (totalPages <= 1) return;

                const container = document.querySelector('.table-container');
                const paginationDiv = document.createElement('div');
                paginationDiv.id = 'paginationControls';
                paginationDiv.style.cssText =
                    'display:flex; justify-content:center; align-items:center; gap:0.5rem; padding:0.8rem 1rem; background:#f8fafc; border-top:1px solid #e9edf2; flex-wrap:wrap;';


                const firstBtn = document.createElement('button');
                firstBtn.textContent = '⏮ 首页';
                firstBtn.className = 'btn btn-secondary';
                firstBtn.style.cssText = 'padding:0.2rem 0.8rem; font-size:0.8rem;';
                firstBtn.disabled = current <= 1;
                firstBtn.addEventListener('click', () => {
                    if (currentPage > 1) {
                        currentPage = 1;
                        renderBooks(currentFilter);
                    }
                });
                paginationDiv.appendChild(firstBtn);
                
                const prevBtn = document.createElement('button');
                prevBtn.textContent = '◀ 上一页';
                prevBtn.className = 'btn btn-secondary';
                prevBtn.style.cssText = 'padding:0.2rem 0.8rem; font-size:0.8rem;';
                prevBtn.disabled = current <= 1;
                prevBtn.addEventListener('click', () => {
                    if (currentPage > 1) {
                        currentPage--;
                        renderBooks(currentFilter);
                    }
                });
                paginationDiv.appendChild(prevBtn);

                const infoSpan = document.createElement('span');
                infoSpan.textContent = `第 ${current} / ${totalPages} 页（共 ${total} 条）`;
                infoSpan.style.cssText = 'font-size:0.85rem; color:#475569; margin:0 0.5rem;';
                paginationDiv.appendChild(infoSpan);

                const jumpWrapper = document.createElement('span');
                jumpWrapper.style.cssText = 'display:flex; align-items:center; gap:0.3rem;';

                const jumpInput = document.createElement('input');
                jumpInput.type = 'number';
                jumpInput.min = 1;
                jumpInput.max = totalPages;
                jumpInput.value = current;
                jumpInput.style.cssText =
                    'width:50px; padding:0.15rem 0.3rem; border:1px solid #d0d9e6; border-radius:30px; font-size:0.8rem; text-align:center; background:white; outline:none;';
                jumpInput.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        const val = parseInt(this.value);
                        if (val >= 1 && val <= totalPages) {
                            currentPage = val;
                            renderBooks(currentFilter);
                        } else {
                            showToast('请输入 1-' + totalPages + ' 之间的页码', 'error');
                            this.value = current;
                        }
                    }
                });
                jumpInput.addEventListener('blur', function() {
                    const val = parseInt(this.value);
                    if (isNaN(val) || val < 1 || val > totalPages) {
                        this.value = current;
                    }
                });
                jumpWrapper.appendChild(jumpInput);

                const jumpLabel = document.createElement('span');
                jumpLabel.textContent = '页';
                jumpLabel.style.cssText = 'font-size:0.8rem; color:#64748b;';
                jumpWrapper.appendChild(jumpLabel);
                paginationDiv.appendChild(jumpWrapper);

                const nextBtn = document.createElement('button');
                nextBtn.textContent = '下一页 ▶';
                nextBtn.className = 'btn btn-secondary';
                nextBtn.style.cssText = 'padding:0.2rem 0.8rem; font-size:0.8rem;';
                nextBtn.disabled = current >= totalPages;
                nextBtn.addEventListener('click', () => {
                    if (currentPage < totalPages) {
                        currentPage++;
                        renderBooks(currentFilter);
                    }
                });
                paginationDiv.appendChild(nextBtn);


                const lastBtn = document.createElement('button');
                lastBtn.textContent = '尾页 ⏭';
                lastBtn.className = 'btn btn-secondary';
                lastBtn.style.cssText = 'padding:0.2rem 0.8rem; font-size:0.8rem;';
                lastBtn.disabled = current >= totalPages;
                lastBtn.addEventListener('click', () => {
                    if (currentPage < totalPages) {
                        currentPage = totalPages;
                        renderBooks(currentFilter);
                    }
                });
                paginationDiv.appendChild(lastBtn);

                container.appendChild(paginationDiv);
            }

            function renderFilterPanel() {
                const searchTitle = document.getElementById('searchTitle');
                const searchAuthor = document.getElementById('searchAuthor');
                const savedTitle = searchTitle ? searchTitle.value : '';
                const savedAuthor = searchAuthor ? searchAuthor.value : '';

                // 定义每个字段的标签和列占用
                const fieldConfig = {
                    'platform': { label: '📱 平台', cols: 2 },
                    'tags': { label: '🏷️ tag', cols: 4 },
                    'status': { label: '📌 更新状态', cols: 1 },
                    'ending': { label: '🎯 结局', cols: 1 },
                    'attributes': { label: '✨ 属性', cols: 1 },
                    'car': { label: '🚗', cols: 1 },
                    'chapters': { label: '📖 章节', cols: 1 }
                };

                // 按顺序排列：平台(2列) -> tags(4列) -> 状态+结局(各1列) -> 属性+🚗+章节(各1列)
                const orderedFields = ['platform', 'tags', 'status', 'ending', 'attributes', 'car', 'chapters'];

                let html = '';

                // 使用 flex 容器，自动换行，并添加响应式适配
                html += `<div style="display:flex; flex-wrap:wrap; gap:0.5rem 1.5rem; align-items:flex-start; width:100%;">`;

                orderedFields.forEach(fieldKey => {
                    const options = getFilterOptions(fieldKey);
                    const config = fieldConfig[fieldKey];
                    const cols = config ? config.cols : 1;
                    const label = config ? config.label : fieldKey;

                    // ===== 手机端适配：使用响应式宽度 =====
                    // 在手机端（<768px），tags 占满整行，其他占一半
                    // 在电脑端，按原计划分配
                    let flexBasis;
                    let minWidth;
                    let flexGrow = fieldKey === 'tags' ? 3 : 1;

                    if (fieldKey === 'tags') {
                        // tag 在手机端占满整行，电脑端占 4 列
                        flexBasis = '100%';
                        minWidth = '200px';
                        flexGrow = 3;
                    } else if (fieldKey === 'platform') {
                        // 平台在手机端占一半，电脑端占 2 列
                        flexBasis = 'calc(50% - 0.75rem)';
                        minWidth = '120px';
                    } else {
                        // 其他在手机端占一半，电脑端占 1 列
                        flexBasis = 'calc(50% - 0.75rem)';
                        minWidth = '100px';
                    }

                    html += `<div style="flex: ${flexGrow} 1 ${flexBasis}; min-width:${minWidth}; margin-bottom:0.3rem; overflow:hidden;">`;
                    html += `<div style="font-weight:500; font-size:0.8rem; text-transform:uppercase; letter-spacing:0.02em; color:#475569; margin-bottom:0.2rem;">${label}</div>`;
                    html += `<div class="filter-options" data-field="${fieldKey}" style="display:flex; flex-wrap:wrap; gap:0.2rem 0.4rem; width:100%;">`;

                    options.forEach(opt => {
                        const checked = currentFilter[fieldKey]?.has(opt) || false;
                        // 确保标签不溢出，自动换行
                        html += `<label style="display:inline-flex; align-items:center; gap:0.15rem; font-weight:400; font-size:0.8rem; background:#f1f4f9; padding:0.05rem 0.4rem 0.05rem 0.3rem; border-radius:30px; cursor:pointer; border:1px solid transparent; white-space:nowrap; max-width:100%;">
                            <input type="checkbox" value="${opt}" data-field="${fieldKey}" ${checked ? 'checked' : ''} style="accent-color:#1f4b6e; width:13px; height:13px; cursor:pointer; flex-shrink:0;">
                            ${opt}
                        </label>`;
                    });

                    html += `</div></div>`;
                });

                html += '</div>';
                filterGrid.innerHTML = html;

                if (searchTitle) searchTitle.value = savedTitle;
                if (searchAuthor) searchAuthor.value = savedAuthor;
            }

            function getFilterOptions(fieldKey) {
                // 如果是 chapters 字段，只使用 OPTIONS 中预定义的选项，不从 BOOKS 中提取
                if (fieldKey === 'chapters') {
                    return OPTIONS.chapters || [];
                }
                
                // 其他字段：从 BOOKS 中提取 + 预定义选项合并
                const allValues = BOOKS.flatMap(book => {
                    if (fieldKey === 'tags') return book.tags;
                    if (fieldKey === 'platform') return book.platform;
                    return [book[fieldKey]];
                });
                const preset = OPTIONS[fieldKey] || [];
                const combined = [...new Set([...allValues, ...preset])];
                return combined.filter(v => v != null && v !== '').sort();
            }

            function collectFilterFromPanel() {
                FILTER_FIELDS.forEach(field => { currentFilter[field] = new Set(); });
                document.querySelectorAll('#filterGrid input[type="checkbox"]').forEach(cb => {

                        if (currentFilter[field]) currentFilter[field].add(cb.value);
                    }
                });
            }

            function applyFilterAndRender() {
                collectFilterFromPanel();
                currentPage = 1;
                renderBooks(currentFilter);
                updateFilterIndicator();
            }

            function resetFilter() {
                document.querySelectorAll('#filterGrid input[type="checkbox"]').forEach(cb => { cb.checked = false; });
                FILTER_FIELDS.forEach(field => { currentFilter[field] = new Set(); });
                currentPage = 1;
                renderBooks(currentFilter);
                // 作者筛选不受影响
                updateFilterIndicator();
            }

                if (id === null) return;
                const book = BOOKS.find(b => b.id === id);
                if (!book) return;

                const chaptersType = document.getElementById('editChaptersType').value;

                if (chaptersType === '多篇章') {
                    const chaptersNumber = document.getElementById('editChaptersNumber').value.trim();
                    if (!chaptersNumber || parseInt(chaptersNumber) < 1) {
                        showToast('请输入有效的章节数', 'error');
                        return;
                    }
                    chapters = chaptersNumber + '章';
                }

                book.title = document.getElementById('editTitle').value.trim() || book.title;
                book.author = document.getElementById('editAuthor').value.trim() || book.author;
                const platformChecks = document.querySelectorAll('#editPlatformContainer input[type="checkbox"]:checked');
                book.platform = Array.from(platformChecks).map(cb => cb.value);
                const tagChecks = document.querySelectorAll('#editTagsContainer input[type="checkbox"]:checked');
                book.tags = Array.from(tagChecks).map(cb => cb.value);
                book.status = document.getElementById('editStatus').value;
                book.ending = document.getElementById('editEnding').value;
                book.attributes = document.getElementById('editAttributes').value;
                book.car = document.getElementById('editCar').value;

                if (editLinkInputs) {
                    const wrappers = editLinkInputs.querySelectorAll('.edit-link-wrapper');
                    wrappers.forEach(wrapper => {
                        const platform = wrapper.dataset.platform;
                        const input = wrapper.querySelector('input');

                            editLinkDataArray.push({
                                platform: platform,
                                url: input.value.trim()
                            });

                    });

                if (success) {
                    closeEditModal();
                    renderFilterPanel();
                    renderBooks(currentFilter);

            async function addBookFromModal() {
                const title = document.getElementById('addTitle').value.trim();
                const author = document.getElementById('addAuthor').value.trim();
                const platformChecks = document.querySelectorAll('#addPlatformContainer input[type="checkbox"]:checked');
                const platform = Array.from(platformChecks).map(cb => cb.value);
                const status = document.getElementById('addStatus').value;
                const ending = document.getElementById('addEnding').value;
                const attributes = document.getElementById('addAttributes').value;
                const car = document.getElementById('addCar').value;
                const chaptersType = document.getElementById('addChaptersType').value;
                const chaptersNumber = document.getElementById('addChaptersNumber').value.trim();
                // 收集所有平台链接
                const linkData = [];
                const addLinkInputs = document.getElementById('addLinkInputs');
                if (addLinkInputs) {
                    const wrappers = addLinkInputs.querySelectorAll('.add-link-wrapper');
                    wrappers.forEach(wrapper => {
                        const platform = wrapper.dataset.platform;
                        const input = wrapper.querySelector('input');
                        if (input && input.value.trim()) {
                            linkData.push({
                                platform: platform,
                                url: input.value.trim()
                            });
                        }
                    });
                }
                // 如果没有任何链接，至少保留一个空数组
                const link = linkData;
                const tagChecks = document.querySelectorAll('#addTagsContainer input[type="checkbox"]:checked');
                const tags = Array.from(tagChecks).map(cb => cb.value);

                if (!title || !author || platform.length === 0 || !status || !ending || !attributes || !car || !chaptersType) {
                    showToast('请完整填写所有必填项', 'error');
                    return;
                }

                let chapters = chaptersType;
                if (chaptersType === '多篇章') {
                    if (!chaptersNumber || parseInt(chaptersNumber) < 1) {
                        showToast('请输入有效的章节数', 'error');
                        return;
                    }
                    chapters = chaptersNumber + '章';
                }

                const duplicate = BOOKS.some(book =>
                    book.title.trim().toLowerCase() === title.toLowerCase()
                );
                if (duplicate) {
                    showToast('⚠️ 文章 "' + title + '" 已存在，请勿重复添加！', 'error');
                    return;
                }

                const newBook = {
                    id: nextId++,
                    title,
                    author,
                    platform,
                    tags,
                    status,
                    ending,
                    attributes,
                    car,
                    chapters,
                    link: linkData,  // 改为数组
                    sort_order: BOOKS.length + 1    
                };

                const { error } = await supabaseClient
                    .from('books')
                    .insert([newBook]);

                if (error) {
                    showToast('添加失败: ' + error.message, 'error');
                    return;
                }

                BOOKS.push(newBook);
                closeAddModal();
                renderFilterPanel();
                renderBooks(currentFilter);
                showToast('添加成功', 'success');
            }

            function renderOptionsManager() {
                const container = optionsContainer;
                let html = '';
                const groups = [
                    { key: 'platform', label: '平台' },
                    { key: 'status', label: '更新状态' },
                    { key: 'ending', label: '结局' },
                    { key: 'attributes', label: '属性' },
                    { key: 'car', label: '🚗' },
                    { key: 'chapters', label: '章节' },
                    { key: 'tags', label: 'Tag' }
                ];

                groups.forEach(g => {
                    const items = OPTIONS[g.key] || [];
                    html += `<div class="option-group" data-group="${g.key}">
                            <div class="group-title">${g.label}</div>
                            <div class="option-tag-list" id="optList_${g.key}">`;
                    items.forEach(item => {
                        html +=
                            `<span class="option-tag-item">${item} <button class="del-opt" data-group="${g.key}" data-value="${item}">×</button></span>`;
                    });
                    html += `</div>
                            <div class="option-add-row">
                                <input type="text" placeholder="添加新选项" class="opt-add-input" data-group="${g.key}">
                                <button class="btn-sm opt-add-btn" data-group="${g.key}">添加</button>
                            </div>
                        </div>`;
                });
                container.innerHTML = html;

                container.querySelectorAll('.del-opt').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const group = this.dataset.group;
                        const value = this.dataset.value;
                        if (OPTIONS[group]) {
                            OPTIONS[group] = OPTIONS[group].filter(v => v !== value);
                            renderOptionsManager();
                            renderFilterPanel();
                            renderBooks(currentFilter);
                        }
                    });
                });

                container.querySelectorAll('.opt-add-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const group = this.dataset.group;
                        const input = this.parentElement.querySelector('.opt-add-input');
                        const val = input.value.trim();
                        if (val && OPTIONS[group] && !OPTIONS[group].includes(val)) {
                            OPTIONS[group].push(val);
                            renderOptionsManager();
                            renderFilterPanel();
                            renderBooks(currentFilter);
                        } else if (!val) {
                            showToast('请输入内容', 'error');
                        } else {
                            showToast('选项已存在', 'error');
                        }
                    });
                });
            }

            function openOptionsModal() {
                OPTIONS_BACKUP = JSON.parse(JSON.stringify(OPTIONS));
                renderOptionsManager();
                optionsModal.classList.add('active');
            }

            function closeOptionsModal() {
                optionsModal.classList.remove('active');
                // 如果有点击取消的标记，恢复备份
                if (OPTIONS_BACKUP) {
                    OPTIONS = JSON.parse(JSON.stringify(OPTIONS_BACKUP));
                    OPTIONS_BACKUP = null;
                    // 重新渲染相关界面
                    renderFilterPanel();
                    renderAddRowSelectors();
                    renderBooks(currentFilter);
                }
            }
